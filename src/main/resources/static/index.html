<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Patterns</title>
  <style>
    :root {
      --bg: #f4efe5;
      --panel: rgba(255, 252, 246, 0.92);
      --text: #1e1a16;
      --muted: #6c655d;
      --border: rgba(30, 26, 22, 0.12);
      --accent: #b64d2d;
      --accent-dark: #8f381e;
      --shadow: 0 24px 70px rgba(85, 53, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(182, 77, 45, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(56, 89, 74, 0.18), transparent 30%),
        linear-gradient(135deg, #efe7d8 0%, #f8f3ea 44%, #efe3cf 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(100%, 780px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: var(--shadow);
      padding: 40px 32px;
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 76px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .subhead {
      margin: 14px 0 28px;
      max-width: 42rem;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button, a.link-button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 14px 18px;
      font: inherit;
      font-size: 15px;
      text-decoration: none;
    }

    select {
      flex: 1 1 280px;
      background: #fff;
      color: var(--text);
      min-height: 52px;
    }

    button {
      background: var(--accent);
      color: #fff8f1;
      cursor: pointer;
      min-width: 120px;
      border-color: transparent;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.65;
      cursor: progress;
    }

    .result {
      margin-top: 24px;
      padding: 18px 20px;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.72);
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-title {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .result p {
      margin: 6px 0;
      color: var(--muted);
    }

    .result code {
      font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      background: rgba(30, 26, 22, 0.06);
      border-radius: 8px;
      padding: 2px 6px;
    }

    .result-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    a.link-button {
      color: var(--text);
      background: #fff;
    }

    .error {
      color: #8f381e;
    }

    @media (max-width: 640px) {
      .shell {
        padding: 28px 20px;
        border-radius: 24px;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">Spring AI + Temporal</p>
    <h1>Workflow Patterns</h1>
    <p class="subhead">
      Choose a workflow pattern, click Run, and this page will start it with sample input. After it starts, you will get a direct link to the workflow run in Temporal UI plus a status endpoint for the API response.
    </p>

    <div class="controls">
      <select id="pattern" aria-label="Select a workflow pattern">
        <option value="sequential">Sequential Processing</option>
        <option value="routing">Routing</option>
        <option value="parallel">Parallel Processing</option>
        <option value="evaluator">Evaluator-Optimizer</option>
        <option value="orchestrator">Orchestrator-Worker</option>
      </select>
      <button id="runButton" type="button">Run</button>
    </div>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <script>
    const runButton = document.getElementById("runButton");
    const patternSelect = document.getElementById("pattern");
    const result = document.getElementById("result");

    function showResult(html, isError = false) {
      result.className = "result visible" + (isError ? " error" : "");
      result.innerHTML = html;
    }

    runButton.addEventListener("click", async () => {
      const pattern = patternSelect.value;
      runButton.disabled = true;
      runButton.textContent = "Running...";

      try {
        const response = await fetch(`/api/workflows/${pattern}/start?useSampleInput=true`, {
          method: "POST"
        });

        const body = await response.json();
        if (!response.ok) {
          throw new Error(body.error || "Unable to start workflow.");
        }

        showResult(`
          <h2 class="result-title">Workflow triggered</h2>
          <p>Pattern: <code>${body.pattern}</code></p>
          <p>Workflow ID: <code>${body.workflowId}</code></p>
          <p>Run ID: <code>${body.runId}</code></p>
          <div class="result-actions">
            <a class="link-button" href="${body.temporalUiUrl}" target="_blank" rel="noreferrer">Open in Temporal UI</a>
          </div>
        `);
      } catch (error) {
        showResult(`
          <h2 class="result-title">Workflow failed to start</h2>
          <p>${error.message}</p>
        `, true);
      } finally {
        runButton.disabled = false;
        runButton.textContent = "Run";
      }
    });
  </script>
</body>
</html>
